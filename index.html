<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleazar Mico Villamor | Portfolio</title>
    <style>
        /* Modern CSS reset */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 0;
            /* Design: Dark background mula sa iyong reference */
            background-color: #121212; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Design: Top Navigation Bar */
        header {
            background-color: #1a1a1a;
            padding: 20px 0;
            width: 100%;
            border-bottom: 1px solid #333;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #a0a0a0; /* Grey color for links */
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff; /* White on hover */
        }

        /* Design: Main Hero Section */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 80px auto;
            padding: 0 40px;
            gap: 60px;
        }

        .hero-text {
            flex: 1;
        }

        /* Design: White big name */
        h1 { 
            font-size: 3.5rem;
            margin: 0 0 20px 0;
            color: #ffffff;
        }

        /* Design: Sub-text */
        p { 
            color: #a0a0a0;
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Design: Circular Photo Frame */
        .profile-photo-container {
            flex-shrink: 0;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            overflow: hidden; /* Makes the photo circular */
            border: 4px solid #ffffff; /* white border */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); /* shadow for depth */
        }

        .profile-photo {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the photo fills the circle properly */
        }

        /* Design: Green Button */
        .cta-button { 
            display: inline-block;
            padding: 15px 40px;
            background-color: #38a169; /* Green color mula sa iyong reference */
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(56, 161, 105, 0.4);
        }

        .cta-button:hover { 
            background-color: #48bb78; /* Lighter green on hover */
            transform: translateY(-2px); /* Slight lift on hover */
        }

        /* Responsive design for smaller screens */
        @media (max-width: 800px) {
            .hero {
                flex-direction: column-reverse; /* Put text below photo */
                text-align: center;
                gap: 40px;
            }

            nav ul {
                flex-wrap: wrap;
                gap: 15px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .profile-photo-container {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <!-- Design: Navigation Links -->
                <li><a href="#">Home</a></li>
                <li><a href="#about">About Me</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
                <!-- Pwede mo itong palitan ng actual links mo sa LinkedIn/etc -->
                <li><a href="#" target="_blank">in</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">
        <div class="hero-text">
            <!-- Design: Your Name -->
            <h1>Eleazar Mico B. Villamor</h1>
            <!-- Design: Intro/Role text -->
            <p>Civil Engineering Graduate | Aspiring BIM Modeler / Engineer. Focused on creating efficient, practical design and operational models for modern infrastructure.</p>
            <!-- Design: The Call to Action button -->
            <a href="portfolio.html" class="cta-button">View My Portfolio ></a>
        </div>

        <!-- Design: Circular Profile Photo using renamed profile.jpg -->
        <div class="profile-photo-container">
            <img src="profile.jpg" alt="Eleazar Mico Villamor" class="profile-photo">
        </div>
    </main>
</body>
</html>
