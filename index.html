<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleazar Mico Villamor | Portfolio</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 0;
            background-color: #121212; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1a1a1a;
            padding: 20px 0;
            width: 100%;
            border-bottom: 1px solid #333;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #a0a0a0;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 80px auto;
            padding: 0 40px;
            gap: 60px;
        }

        .hero-text {
            flex: 1;
        }

        h1 { 
            font-size: 3.5rem;
            margin: 0 0 20px 0;
            color: #ffffff;
        }

        p { 
            color: #a0a0a0;
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .profile-photo-container {
            flex-shrink: 0;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .profile-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cta-button { 
            display: inline-block;
            padding: 15px 40px;
            background-color: #38a169;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(56, 161, 105, 0.4);
        }

        .cta-button:hover { 
            background-color: #48bb78;
            transform: translateY(-2px);
        }

        @media (max-width: 800px) {
            .hero {
                flex-direction: column-reverse;
                text-align: center;
                gap: 40px;
            }

            nav ul {
                flex-wrap: wrap;
                gap: 15px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .profile-photo-container {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#about">About Me</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">
        <div class="hero-text">
            <h1>Eleazar Mico B. Villamor</h1>
            <p>Civil Engineering Graduate | Aspiring BIM Modeler / Engineer. Focused on creating efficient, practical design and operational models for modern infrastructure.</p>
            
            <!-- Direct link papunta sa Google Drive folder mo -->
            <a href="https://drive.google.com/drive/folders/1XjXwcU9agTmntCplXjzcESnkkdB4ukMg?usp=drive_link" target="_blank" class="cta-button">View My Portfolio ></a>
        </div>

        <!-- Inayos ang src gamit ang aktwal na filename ng pic mo (DSC_8250.JPG) -->
        <div class="profile-photo-container">
            <img src="DSC_8250.JPG" alt="Eleazar Mico Villamor" class="profile-photo">
        </div>
    </main>
</body>
</html>
