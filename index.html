<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleazar Mico Villamor | Civil Engineer & BIM Modeler</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .splash-link {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
            color: white;
            
            /* Ginamit ang webbackground.avif */
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), url('webbackground.avif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            transition: background-image 0.3s ease;
        }

        .splash-link:hover {
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.5)), url('webbackground.avif');
            cursor: pointer;
        }

        .splash-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .splash-subtitle {
            font-size: 1.4rem;
            margin-bottom: 30px;
            font-weight: 300;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .click-prompt {
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffffff;
            background-color: rgba(26, 54, 93, 0.85);
            padding: 12px 24px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <a href="portfolio.html" class="splash-link">
        <div class="splash-title">Eleazar Mico Villamor</div>
        <div class="splash-subtitle">Civil Engineering & BIM Modeling Portfolio</div>
        <div class="click-prompt">Click anywhere to enter portfolio</div>
    </a>
</body>
</html>
